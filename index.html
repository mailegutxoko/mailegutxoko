<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mailegutxoko</title>
<style>
:root{--bg:#f1f3f4;--card:#fff;--ink:#202124;--muted:#5f6368;--blue:#4285f4;--blue-d:#2f6fd6;--line:#dadce0;--red:#c5221f;--green:#188038}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:820px;margin:0 auto;padding:24px 16px 64px}
header.top{text-align:center;margin:24px 0}
header.top h1{margin:0;font-size:2.2rem}
header.top p{margin:6px 0 0;color:var(--muted)}
.user{display:flex;justify-content:flex-end;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);min-height:36px}
button{font:inherit;border:0;border-radius:8px;padding:12px 16px;background:var(--blue);color:#fff;cursor:pointer}
button:hover{background:var(--blue-d)}
button:focus-visible,input:focus-visible{outline:3px solid #1a73e8;outline-offset:2px}
button.ghost{background:transparent;color:var(--blue-d);padding:8px 10px}
button.ghost:hover{background:#e8f0fe}
button.danger{background:var(--red)}
button.small{padding:6px 12px;font-size:.9rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.panel h3{margin:0 0 12px;font-size:1.05rem}
form{display:grid;gap:12px}
label{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
input{font:inherit;padding:10px;border:1px solid var(--line);border-radius:6px;width:100%;color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .info{flex:1;min-width:0}
.row small{display:block;color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.8rem;background:#e6f4ea;color:var(--green)}
.tag.wait{background:#fef7e0;color:#b06000}
.tag.off{background:#fce8e6;color:var(--red)}
.empty{color:var(--muted);padding:8px 0}
.menu{display:grid;gap:12px;margin:16px 0}
.sname{text-align:center;font-size:1.4rem;font-weight:700;margin:8px 0}
.bar{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.bar h2{margin:0;font-size:1.4rem}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#e8f0fe;border:1px solid #aecbfa;color:#174ea6;border-radius:10px;padding:12px 16px;margin-bottom:16px}
.banner.err{background:#fce8e6;border-color:#f5b5b1;color:var(--red)}
button.danger:hover{background:#a50e0e}
button:disabled{background:#bdc1c6;cursor:not-allowed}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:.93rem;white-space:nowrap}
th{color:var(--muted)}
.qr svg{width:56px;height:56px;display:block;background:#fff}
.search{margin-bottom:12px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;z-index:10}
.dialog{position:relative;background:#fff;border-radius:12px;padding:24px;max-width:420px;width:100%;display:grid;gap:12px}
.dialog h3{margin:0 28px 0 0}.dialog p{margin:0}
.x{position:absolute;top:8px;right:8px;background:transparent;color:var(--muted);font-size:1.4rem;padding:2px 10px}
.x:hover{background:#eee}
.ell{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ell.s{max-width:150px}
#tip{position:fixed;display:none;z-index:20;background:#202124;color:#fff;padding:6px 10px;border-radius:6px;max-width:min(420px,90vw);font-size:.9rem;pointer-events:none}
.pager{display:flex;gap:12px;align-items:center;justify-content:center;margin:12px 0;color:var(--muted)}
#reader{width:100%;max-width:420px;margin:0 auto}
.bookbox{display:flex;gap:16px;align-items:flex-start;margin-bottom:12px}
.bookbox img{max-height:130px;border-radius:4px}
.bookbox p{margin:2px 0}
@media(max-width:640px){th,td{padding:10px 8px}}
.isbnform{margin-top:12px}
.bar{flex-wrap:wrap}
.bar h2{min-width:0;overflow-wrap:anywhere}
.row .info{overflow-wrap:anywhere}
.banner{flex-wrap:wrap}
.user{flex-wrap:wrap}
.sname{overflow-wrap:anywhere}
.tag{white-space:nowrap}
th.sortable{cursor:pointer;user-select:none;-webkit-user-select:none}
th.sortable:hover{background:#f1f3f4}
th .arr{color:var(--blue-d)}
.camBox{position:relative;width:100%;max-width:480px;margin:0 auto;border-radius:8px;overflow:hidden;background:#000}
.camBox video{width:100%;display:block}
.camBox canvas{display:none}
.steps{display:flex;list-style:none;padding:0;margin:0 0 16px;gap:4px}
.steps li{flex:1;min-width:0;text-align:center;font-size:.78rem;color:var(--muted);position:relative;overflow-wrap:anywhere}
.steps li b{position:relative;z-index:1;display:grid;place-items:center;width:30px;height:30px;margin:0 auto 6px;border-radius:50%;background:#dadce0;color:#5f6368;font-size:.9rem}
.steps li:not(:first-child)::before{content:"";position:absolute;top:14px;right:50%;width:100%;height:3px;background:#dadce0}
.steps li.done b{background:var(--green);color:#fff}
.steps li.done::before,.steps li.cur::before{background:var(--green)}
.steps li.cur b{background:var(--blue);color:#fff;box-shadow:0 0 0 4px #d2e3fc}
.steps li.cur{color:var(--ink);font-weight:700}
.scanhint{display:flex;gap:12px;align-items:center;border-radius:10px;padding:12px 16px;margin-bottom:12px;font-size:1.05rem;font-weight:600;background:#e8f0fe;color:#174ea6}
.scanhint.qr{background:#fef7e0;color:#8a5a00}
.scanhint .ico{font-size:1.8rem}
#lang{font-weight:700;border:1px solid var(--line);background:#fff;margin-left:8px}
.camBox::after{content:"";position:absolute;pointer-events:none;border:3px solid rgba(255,255,255,.9);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.28)}
.camBox.isbn::after{top:30%;bottom:30%;left:5%;right:5%}
.camBox.qr::after{top:12%;height:76%;aspect-ratio:1;left:50%;transform:translateX(-50%)}
#msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#202124;color:#fff;padding:10px 18px;border-radius:8px;display:none;max-width:90vw}
#msg.err{background:var(--red)}
</style>

<style id="mailegutxoko-modern-theme">
/* Mailegutxoko · renovación visual minimalista */
:root{
  --bg:#f5f7f8;--card:#fff;--ink:#172b3a;--muted:#687985;
  --blue:#176b68;--blue-d:#105653;--line:#e3e9eb;
  --red:#b54745;--green:#247a59;
  --accent-soft:#e8f3f1;--shadow:0 8px 24px rgba(25,48,58,.055);
}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--ink);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased;
}
main{max-width:1180px;margin:0 auto;padding:24px 28px 72px}
header.top{
  text-align:left;margin:12px 0 30px;padding:24px 28px;
  background:linear-gradient(115deg,#fff 0%,#f4faf9 100%);
  border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  position:relative;overflow:hidden;
}
header.top:after{
  content:"";position:absolute;width:190px;height:190px;border-radius:50%;
  right:-55px;top:-95px;background:rgba(23,107,104,.07);pointer-events:none;
}
header.top h1{font-size:clamp(1.8rem,3vw,2.35rem);letter-spacing:-.055em;font-weight:750;color:#163c43}
header.top p{margin:5px 0 0 2px;color:var(--muted);font-size:.98rem}
.user{min-height:34px;gap:10px;font-size:.84rem;color:var(--muted);padding:0 4px}
#lang{border-radius:999px;padding:7px 13px;font-size:.78rem;letter-spacing:.04em}
button{
  border-radius:10px;padding:11px 17px;background:var(--blue);font-weight:650;
  box-shadow:0 2px 5px rgba(23,107,104,.12);transition:background .18s,transform .18s,box-shadow .18s;
}
button:hover{background:var(--blue-d);transform:translateY(-1px);box-shadow:0 5px 12px rgba(23,107,104,.14)}
button:active{transform:translateY(0)}
button:focus-visible,input:focus-visible{outline:3px solid rgba(23,107,104,.25);outline-offset:2px}
button.ghost{background:transparent;color:var(--blue);box-shadow:none}
button.ghost:hover{background:var(--accent-soft);box-shadow:none}
button.danger{background:#b54745;box-shadow:none}
button.danger:hover{background:#963b39}
button.small{padding:7px 11px;font-size:.84rem;border-radius:8px}
.panel{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:22px;margin-bottom:18px;box-shadow:var(--shadow);
}
.panel h3{font-size:1.02rem;font-weight:700;letter-spacing:-.015em;margin:0 0 15px;color:#233e49}
form{gap:15px}
label{font-size:.84rem;font-weight:600;color:#526571;gap:7px}
input{
  padding:12px 13px;border:1px solid #d9e2e5;border-radius:9px;background:#fff;
  transition:border-color .15s,box-shadow .15s;
}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,107,104,.09);outline:0}
input::placeholder{color:#9aa8ae}
.row{padding:14px 4px;border-bottom:1px solid #edf1f2;gap:14px}
.row strong{font-weight:650;color:#243d48}
.row small{margin-top:3px;color:var(--muted)}
.tag{padding:4px 9px;border-radius:999px;font-size:.75rem;font-weight:650;background:#e7f3ed;color:#247a59}
.tag.wait{background:#fff4dc;color:#93610b}
.tag.off{background:#fcebea;color:#ad4441}
.empty{color:#87969e;padding:12px 0}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:20px 0}
.menu button{
  min-height:86px;text-align:left;display:flex;align-items:center;justify-content:flex-start;
  padding:18px 20px;background:#fff;color:#24414b;border:1px solid var(--line);
  box-shadow:var(--shadow);font-size:.98rem;position:relative;
}
.menu button:before{
  content:"";width:34px;height:34px;flex:0 0 34px;margin-right:12px;border-radius:10px;
  background:var(--accent-soft);
}
.menu button:after{content:"↗";margin-left:auto;color:#7c9998;font-size:1rem}
.menu button:hover{background:#fbfefd;border-color:#b9d5d1;color:var(--blue-d)}
.menu button:nth-child(1):before{background:#e6f2f1}
.menu button:nth-child(2):before{background:#edf1fa}
.menu button:nth-child(3):before{background:#fdf1e5}
.menu button:nth-child(4):before{background:#f1ecf8}
.menu button:nth-child(5):before{background:#edf3e8}
.sname{
  text-align:left;font-size:1.18rem;font-weight:750;letter-spacing:-.02em;
  margin:8px 0 4px;padding:17px 20px;background:#fff;border:1px solid var(--line);
  border-radius:14px;color:#23434b;box-shadow:var(--shadow);
}
.sname .tag{margin-left:7px;vertical-align:middle}
.bar{gap:14px;margin:8px 0 20px}
.bar h2{font-size:1.45rem;letter-spacing:-.04em;font-weight:750;color:#203c47}
.banner{
  background:#edf6f4;border:1px solid #d0e6e2;color:#245d59;
  border-radius:12px;padding:13px 16px;margin-bottom:16px;
}
.banner.err{background:#fff0ef;border-color:#f2d0ce;color:#a33f3c}
.tools{gap:9px;margin-bottom:16px}
.tablewrap{border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
table{background:#fff}
th,td{padding:13px 14px;border-bottom:1px solid #edf1f2;font-size:.9rem}
th{background:#f8fafb;color:#657780;font-size:.78rem;font-weight:700;letter-spacing:.025em}
tbody tr:hover{background:#f9fcfb}
th.sortable:hover{background:#eef5f4}
.pager{gap:14px;margin:16px 0}
.overlay{background:rgba(19,38,46,.48);backdrop-filter:blur(4px)}
.dialog{border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 24px 70px rgba(15,35,42,.2)}
.dialog h3{font-size:1.15rem;letter-spacing:-.025em}
.x{border-radius:8px;box-shadow:none}
.bookbox{padding:12px;background:#f8fafb;border:1px solid var(--line);border-radius:12px}
.bookbox img{border-radius:7px;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.steps li b{font-weight:700}
.steps li.done b{background:var(--green)}
.steps li.cur b{background:var(--blue);box-shadow:0 0 0 4px #dcecea}
.steps li.done::before,.steps li.cur::before{background:var(--green)}
.scanhint{border-radius:12px;background:#eaf4f2;color:#205c58}
.scanhint.qr{background:#fff5e3;color:#875b15}
#msg{border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.18);font-weight:600}
#msg.err{background:#a83f3d}
#tip{border-radius:8px;box-shadow:0 5px 20px rgba(0,0,0,.2)}
@media(max-width:700px){
  main{padding:14px 14px 48px}
  header.top{padding:20px;margin:8px 0 22px;border-radius:15px}
  .panel{padding:17px;border-radius:13px}
  .menu{grid-template-columns:1fr 1fr;gap:10px}
  .menu button{min-height:76px;padding:13px 12px;font-size:.88rem}
  .menu button:before{width:28px;height:28px;flex-basis:28px;margin-right:8px}
}
@media(max-width:430px){
  .menu{grid-template-columns:1fr}
  .menu button{min-height:62px}
  .user{justify-content:flex-start}
  .acts{justify-content:flex-start}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{scroll-behavior:auto!important;transition:none!important}
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>
<script>
const SUPER_EMAIL = "j.borrego@irakasle.eus";
firebase.initializeApp({
  apiKey: "AIzaSyBcz8brF36QgFIv-Jn6MSTeJsMp-BzmExs",
  authDomain: "mailegutxoko.firebaseapp.com",
  projectId: "mailegutxoko",
  storageBucket: "mailegutxoko.firebasestorage.app",
  messagingSenderId: "1042844464428",
  appId: "1:1042844464428:web:d2e93608ec4a2800bb2889"
});
const auth = firebase.auth(), db = firebase.firestore(), FV = firebase.firestore.FieldValue;
const $app = document.getElementById("app");
let me = null, isSuper = false, cur = null, flash = null, synced = false, dirList = [];

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t, err){ const m = document.getElementById("msg"); m.textContent = t; m.className = err ? "err" : ""; m.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => m.style.display = "none", 4000); }
const fail = e => { console.error(e); toast(e.code === "failed-precondition" ? "Falta crear un índice en Firestore: abre la consola (F12) y pulsa el enlace del error." : (e.message || "Error"), true); };
const memberRef = (sid, uid) => db.doc(`schools/${sid}/members/${uid}`);
const note = (t, k) => { flash = { t, k }; };
const flashHtml = () => { const f = flash; flash = null; return f ? `<div class="banner ${f.k || ""}" role="status">${esc(f.t)}</div>` : ""; };
const loading = t => `<div class="empty">${t}</div>`;

// ---------- Sesión ----------
function setBar(){
  const bar = document.getElementById("userbar");
  bar.innerHTML = me ? `${esc(me.email)}${isSuper ? ' <span class="tag">Superadmin</span>' : ""} <button class="ghost small" id="out">Salir</button>` : "";
  if(me) document.getElementById("out").onclick = () => auth.signOut();
}
let verifyTimer = null;
const authLang = () => { auth.languageCode = "es"; };   // una sola plantilla bilingüe (euskara + castellano): se edita en Authentication → Plantillas
auth.onAuthStateChanged(async u => {
  me = u; isSuper = false; clearInterval(verifyTimer); setBar();
  if(!u) return renderLogin();
  if(!u.emailVerified && u.providerData.some(p => p.providerId === "password")) return renderVerify();
  startSession(u);
});
async function startSession(u){
  me = u; isSuper = u.emailVerified && u.email === SUPER_EMAIL; setBar();
  try{
    await db.collection("users").doc(u.uid).set({ email: u.email, displayName: u.displayName || "", lastLogin: FV.serverTimestamp() }, { merge: true });
    const last = localStorage.getItem("school_" + u.uid);
    last ? enterSchool(last) : renderChooser();
  }catch(e){ fail(e); renderChooser(); }
}

// 1) Pantalla inicial: Google
function renderLogin(){
  $app.innerHTML = `<div class="panel"><h3>Iniciar sesión</h3>
    <button id="g" style="width:100%">Entrar con Google</button>
    <button class="ghost" id="viaMail" style="width:100%;margin-top:12px">o con correo y contraseña</button></div>`;
  document.getElementById("g").onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(authFail);
  document.getElementById("viaMail").onclick = renderLoginMail;
}
// 2) Correo y contraseña
function renderLoginMail(){
  $app.innerHTML = `<div class="bar"><button class="ghost" id="back">← Volver</button><h2>Correo y contraseña</h2></div>
    <div class="panel"><form id="f"><label>Correo<input type="email" name="e" required autocomplete="email"></label>
    <label>Contraseña<input type="password" name="p" required autocomplete="current-password"></label><button>Entrar</button></form>
    <div class="tools" style="margin:12px 0 0;justify-content:space-between"><button class="ghost" id="toSignup">Crear cuenta</button><button class="ghost" id="toReset">Recuperar contraseña</button></div></div>`;
  document.getElementById("back").onclick = renderLogin;
  document.getElementById("toSignup").onclick = renderSignup;
  document.getElementById("toReset").onclick = renderReset;
  const f = document.getElementById("f");
  f.onsubmit = e => { e.preventDefault(); auth.signInWithEmailAndPassword(f.e.value.trim(), f.p.value).catch(authFail); };
}
// 3) Crear cuenta (con confirmación por correo)
function renderSignup(){
  $app.innerHTML = `<div class="bar"><button class="ghost" id="back">← Volver</button><h2>Crear cuenta</h2></div>
    <div class="panel"><form id="f"><label>Nombre<input name="n" required autocomplete="given-name"></label><label>Apellidos<input name="a" required autocomplete="family-name"></label>
    <label>Correo<input type="email" name="e" required autocomplete="email"></label>
    <label>Contraseña (mínimo 6 caracteres)<input type="password" name="p" minlength="6" required autocomplete="new-password"></label>
    <label>Repite la contraseña<input type="password" name="p2" minlength="6" required autocomplete="new-password"></label><button>Crear cuenta</button></form></div>`;
  document.getElementById("back").onclick = renderLoginMail;
  const f = document.getElementById("f");
  f.onsubmit = async e => {
    e.preventDefault();
    if(f.p.value !== f.p2.value) return toast("Las contraseñas no coinciden.", true);
    try{
      authLang();
      const cred = await auth.createUserWithEmailAndPassword(f.e.value.trim(), f.p.value);
      await cred.user.updateProfile({ displayName: `${f.n.value.trim()} ${f.a.value.trim()}` });
      await cred.user.sendEmailVerification();
    }catch(err){ authFail(err); }
  };
}
// 4) Recuperar contraseña
function renderReset(){
  $app.innerHTML = `<div class="bar"><button class="ghost" id="back">← Volver</button><h2>Recuperar contraseña</h2></div>

function renderVerify(){
  $app.innerHTML = `<div class="panel"><h3>Confirma tu correo</h3>
    <div class="banner"><span>Te hemos enviado un correo a ${esc(me.email)}. Abre el mensaje y pulsa el enlace para confirmar tu cuenta. Después vuelve aquí.</span></div>
    <div class="tools"><button id="chk">Ya lo he confirmado</button><button class="ghost" id="rs">Reenviar correo</button></div></div>`;
  document.getElementById("chk").onclick = () => checkVerified(false);
  document.getElementById("rs").onclick = async () => {
    try{ authLang(); await me.sendEmailVerification(); toast("Correo de confirmación reenviado."); }catch(err){ authFail(err); }
  };
  clearInterval(verifyTimer); verifyTimer = setInterval(() => checkVerified(true), 4000);
}
async function checkVerified(silent){
  const u = auth.currentUser; if(!u) return;
  try{ await u.reload(); }catch(e){ return; }
  if(u.emailVerified){ clearInterval(verifyTimer); await u.getIdToken(true); startSession(u); }
  else if(!silent) toast("Todavía no has confirmado el correo.", true);
}

async function approveSchool(id){
  try{
    const ref = db.doc("schools/" + id), s = (await ref.get()).data(), b = db.batch();
    b.update(ref, { status: "approved" });
    b.set(db.doc("directory/" + id), { name: s.name, centerCode: s.centerCode || "" });
    b.set(memberRef(id, s.ownerUid), { uid: s.ownerUid, email: s.ownerEmail, displayName: s.ownerName || "", role: "admin", status: "active", schoolName: s.name, createdAt: FV.serverTimestamp() });
    await b.commit(); toast("Centro aprobado"); renderChooser();
  }catch(e){ fail(e); }
}
async function rejectSchool(id){

}

function askDelete(sid){
  if(!isSuper) return;
  const name = (window.rowsCache.find(r => r.sid === sid) || {}).schoolName || "";
  const o = document.createElement("div"); o.className = "overlay";
  o.innerHTML = `<div class="dialog" role="dialog" aria-modal="true"><button class="x" aria-label="Cerrar">×</button><h3>Eliminar «${esc(name)}»</h3>
    <p>Si quieres eliminar el centro, escribe ELIMINAR en la siguiente casilla para borrarlo.</p>
    <input autocomplete="off" aria-label="Escribe ELIMINAR"><button class="danger" disabled>Eliminar (5)</button></div>`;
  document.body.appendChild(o);
  const inp = o.querySelector("input"), go = o.querySelector(".danger"); let left = 5;
  const upd = () => { go.disabled = !(left <= 0 && ["ELIMINAR", "EZABATU"].includes(inp.value.trim().toUpperCase())); go.textContent = left > 0 ? `Eliminar (${left})` : "Eliminar"; };
  const t = setInterval(() => { left--; if(left <= 0) clearInterval(t); upd(); }, 1000);
  const close = () => { clearInterval(t); document.removeEventListener("keydown", onKey); o.remove(); };
  const onKey = e => { if(e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  o.querySelector(".x").onclick = close; inp.oninput = upd; inp.focus();
  go.onclick = async () => { go.disabled = true; await deleteSchool(sid); close(); };
}
async function deleteSchool(sid){
  try{ // borrado "suave": se conservan libros, alumnos y préstamos para poder recuperarlos
    const mem = await db.collection(`schools/${sid}/members`).get(), b = db.batch();
    mem.forEach(d => b.delete(d.ref));
    b.delete(db.doc("directory/" + sid));
    b.update(db.doc("schools/" + sid), { status: "deleted", deletedAt: FV.serverTimestamp() });
    await b.commit(); toast("Centro eliminado"); renderChooser();
  }catch(e){ fail(e); }
}

// ---------- Utilidades ----------
const backBar = t => `<div class="bar"><button class="ghost" onclick="renderDashboard()">← Volver</button><h2>${t}</h2></div>`;

// ---------- Utilidades de listas ----------
const BOOKS_PER_PAGE = 20, STUDENTS_PER_PAGE = 30;
const PENCIL = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>';
const PAGER = (fn, page, pages) => pages > 1 ? `<div class="pager"><button class="small" ${page <= 0 ? "disabled" : ""} onclick="${fn}(${page - 1})" aria-label="Página anterior">‹</button><span>Página ${page + 1} de ${pages}</span><button class="small" ${page >= pages - 1 ? "disabled" : ""} onclick="${fn}(${page + 1})" aria-label="Página siguiente">›</button></div>` : "";
function modal(inner){
  const o = document.createElement("div"); o.className = "overlay";
  o.innerHTML = `<div class="dialog" role="dialog" aria-modal="true"><button class="x" type="button" aria-label="Cerrar">×</button>${inner}</div>`;
  document.body.appendChild(o);
  const close = () => { document.removeEventListener("keydown", onKey); o.remove(); };
  const onKey = e => { if(e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  o.querySelector(".x").onclick = close;
  return { o, close };
}

// Texto completo: ratón 1 s encima, clic, o mantener pulsado en táctil
(() => {
  const tip = document.createElement("div"); tip.id = "tip"; document.body.appendChild(tip);
  let timer = null, pinTimer = null, pinned = false, suppressUntil = 0;
  const hide = () => { clearTimeout(timer); clearTimeout(pinTimer); pinned = false; tip.style.display = "none"; };
  const cellOf = e => e.target.closest && e.target.closest(".ell");
  const show = (el, touch) => {
    if(el.scrollWidth <= el.clientWidth) return false;   // solo si el texto está recortado
    tip.textContent = el.textContent; tip.style.display = "block";
    const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + "px";
    tip.style.top = Math.max(8, touch ? r.top - h - 8 : r.bottom + 6) + "px";
    return true;
  };
  const arm = (e, ms) => { hide(); const el = cellOf(e); if(el) timer = setTimeout(() => show(el, e.pointerType === "touch"), ms); };
  document.addEventListener("pointerover", e => { if(e.pointerType === "mouse" && !pinned) arm(e, 1000); });
  document.addEventListener("pointermove", e => { if(e.pointerType === "mouse" && !pinned) arm(e, 1000); });
  document.addEventListener("pointerout", e => { if(cellOf(e)) hide(); });
  document.addEventListener("pointerdown", e => { if(e.pointerType === "touch") arm(e, 600); });
  ["pointerup", "pointercancel"].forEach(t => document.addEventListener(t, e => {
    if(e.pointerType === "touch" && tip.style.display === "block" && !pinned) suppressUntil = Date.now() + 600;  // evita que el clic posterior a una pulsación larga lo reabra
    hide();
  }));
  document.addEventListener("click", e => {
    const el = cellOf(e);
    if(!el){ hide(); return; }
    if(Date.now() < suppressUntil) return;
    hide();
    if(show(el, e.pointerType === "touch")){ pinned = true; pinTimer = setTimeout(hide, 3500); }
  });
  document.addEventListener("contextmenu", e => { if(cellOf(e)) e.preventDefault(); });
  document.addEventListener("scroll", hide, true);
})();

async function renderBooks(){

  drawBooks();

function drawBooks(){
  const q = bookQ.toLowerCase(), list = sorted(booksCache.filter(b => `${b.title} ${b.author} ${b.genre || ""} ${b.age || ""} ${b.isbn || b.id}`.toLowerCase().includes(q)), "books", gBook);
  const pages = Math.max(1, Math.ceil(list.length / BOOKS_PER_PAGE)); bookPage = Math.min(bookPage, pages - 1);
  const rows = list.slice(bookPage * BOOKS_PER_PAGE, (bookPage + 1) * BOOKS_PER_PAGE), pg = PAGER("setBookPage", bookPage, pages);
  document.getElementById("tbl").innerHTML = pg + `<div class="tablewrap"><table><thead><tr>${sth("books", "title", "Título")}${sth("books", "author", "Autor")}${sth("books", "publisher", "Editorial")}${sth("books", "genre", "Género")}${sth("books", "age", "Edad")}${sth("books", "isbn", "ISBN")}${sth("books", "avail", "Disponibles")}${cur.admin ? "<th></th>" : ""}</tr></thead><tbody>` +
    rows.map(b => `<tr><td><div class="ell">${esc(b.title)}</div></td><td><div class="ell s">${esc(b.author)}</div></td><td><div class="ell s">${esc(b.publisher)}</div></td><td><div class="ell s">${esc(b.genre) || "—"}</div></td><td>${esc(b.age) || "—"}</td><td>${esc(b.isbn || b.id)}</td>
      <td><span class="tag ${b.availableCopies > 0 ? "" : "off"}">${b.availableCopies ?? 0} / ${b.totalCopies ?? 0}</span></td>
      ${cur.admin ? `<td><div class="acts" style="flex-wrap:nowrap"><button class="small" aria-label="Editar libro" onclick="editBook('${esc(b.id)}')">${PENCIL}</button><button class="small danger" aria-label="Eliminar libro" onclick="deleteBook('${esc(b.id)}')">🗑</button></div></td>` : ""}</tr>`).join("") +
    `</tbody></table>${rows.length ? "" : `<div class="empty" style="padding:16px">${booksCache.length ? "Ningún libro coincide con la búsqueda." : "Todavía no hay libros."}</div>`}</div>` + pg;
}
function setBookPage(p){ bookPage = p; drawBooks(); document.getElementById("tbl").scrollIntoView({ block: "start" }); }

function editBook(id){
  const b = booksCache.find(x => x.id === id);
  if(!cur.admin || !b) return;
  const used = b.activeLoans || 0, { o, close } = modal(`<h3>Editar libro</h3><form><label>ISBN<input value="${esc(b.isbn || b.id)}" disabled></label>
    <label>Título<input name="title" required value="${esc(b.title)}"></label><label>Autor<input name="author" required value="${esc(b.author)}"></label>
    <label>Editorial<input name="publisher" value="${esc(b.publisher)}"></label>
    <label>Género<input name="genre" value="${esc(b.genre)}"></label><label>Edad recomendada<input name="age" value="${esc(b.age)}" placeholder="Ej.: 6-8"></label>
    <label>Ejemplares totales<input name="total" type="number" min="${Math.max(1, used)}" required value="${b.totalCopies ?? 1}"></label><button>Guardar cambios</button></form>`);
  o.querySelector("form").onsubmit = async e => {
    e.preventDefault(); const f = e.target, t = parseInt(f.total.value, 10);
    try{
      await db.doc(`schools/${cur.sid}/books/${id}`).update({ title: f.title.value.trim(), author: f.author.value.trim(), publisher: f.publisher.value.trim(), genre: f.genre.value.trim(), age: f.age.value.trim(), totalCopies: t, availableCopies: t - used, available: t - used > 0 });
      close(); note("Libro actualizado."); renderBooks();
    }catch(err){ fail(err); }
  };
}
async function deleteBook(id){
  const b = booksCache.find(x => x.id === id);
  if(b && b.activeLoans > 0) return toast("No se puede eliminar: tiene préstamos activos", true);
  if(!confirm(`¿Eliminar «${b ? b.title : id}» de la biblioteca?`)) return;

function toIsbn13(x){ // acepta ISBN-10 o ISBN-13 y devuelve siempre ISBN-13
  x = x.replace(/[^\dXx]/g, "").toUpperCase();
  if(x.length === 10){ const b = "978" + x.slice(0, 9); return b + (10 - [...b].reduce((a, c, i) => a + +c * (i % 2 ? 3 : 1), 0) % 10) % 10; }
  return x;
}

}
async function startScan(kind, cb){
  const token = ++scanToken, video = document.getElementById("cam"), status = document.getElementById("scanStatus");
  const say = t => { if(token === scanToken && status) status.textContent = t; };
  const qr = kind === "qr", fmt = qr ? "qr_code" : "ean_13";
  const wait = qr ? "Buscando código QR… Coloca el QR dentro del recuadro." : "Buscando código de barras… Acerca el libro hasta que el código llene el recuadro.";
  const openCam = async (w, h) => {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: w }, height: { ideal: h } } });
    if(token !== scanToken){ stream.getTracks().forEach(t => t.stop()); return false; }
    camStream = stream; video.srcObject = stream; await video.play(); return true;
  };
  try{
    let native = false;   // lector nativo del navegador (Chrome en Android y Mac): el más rápido
    if("BarcodeDetector" in window){ try{ native = (await BarcodeDetector.getSupportedFormats()).includes(fmt); }catch(e){} }
    if(native){
      const det = new BarcodeDetector({ formats: [fmt] });
      if(!(await openCam(1280, 720))) return;
      say(wait);
      const loop = async () => {
        if(token !== scanToken) return;
        try{ const r = await det.detect(video); if(r.length) cb(r[0].rawValue); }catch(e){}
        if(token === scanToken) setTimeout(loop, qr ? 200 : 100);
      };
      loop();
    }else if(qr){   // iPhone y Windows: jsQR sobre fotogramas reducidos (rápido y fiable)
      if(typeof jsQR === "undefined") throw new Error("No se cargó el lector de QR");
      if(!(await openCam(1280, 720))) return;
      say(wait);
      const cv = document.createElement("canvas"), ctx = cv.getContext("2d", { willReadFrequently: true });
      const tick = () => {
        if(token !== scanToken) return;
        if(video.readyState >= 2 && video.videoWidth){
          const k = Math.min(1, 800 / video.videoWidth);
          cv.width = Math.round(video.videoWidth * k); cv.height = Math.round(video.videoHeight * k);
          ctx.drawImage(video, 0, 0, cv.width, cv.height);
          const img = ctx.getImageData(0, 0, cv.width, cv.height), r = jsQR(img.data, img.width, img.height, { inversionAttempts: "dontInvert" });
          if(r && r.data) cb(r.data);
        }
        setTimeout(tick, 70);
      };
      tick();
    }else{   // códigos de barras sin lector nativo (iPhone, Windows): Quagga
      if(typeof Quagga === "undefined") throw new Error("No se cargó el lector de códigos de barras");
      video.remove();   // Quagga crea su propio <video> dentro de #camBox
      const init = workers => new Promise((ok, ko) => Quagga.init({
        inputStream: { type: "LiveStream", target: document.getElementById("camBox"), constraints: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }, area: { top: "30%", right: "5%", left: "5%", bottom: "30%" } },
        locator: { patchSize: "medium", halfSample: true }, numOfWorkers: workers, frequency: 10, locate: true,
        decoder: { readers: ["ean_reader"] }
      }, err => err ? ko(err) : ok()));
      try{ await init(Math.min(2, navigator.hardwareConcurrency || 2)); }catch(e){ await init(0); }   // con hilos de trabajo; si falla, sin ellos
      if(token !== scanToken){ try{ Quagga.stop(); }catch(e){} return; }
      let last = "", hits = 0;   // se exige leer el mismo código dos veces seguidas para evitar lecturas erróneas
      quaggaFn = r => {
        const c = r && r.codeResult && r.codeResult.code;
        if(token !== scanToken || !c) return;
        hits = c === last ? hits + 1 : 1; last = c;
        if(hits >= 2 && /^97[89]\d{10}$/.test(c)) cb(c);
      };
      Quagga.onDetected(quaggaFn); Quagga.start(); quaggaOn = true;
      say(wait);
    }
  }catch(e){ console.error(e); say("No se pudo abrir la cámara. Revisa los permisos del navegador o escribe el código abajo."); }
}
async function lookupIsbn(isbn){ // consulta varias fuentes y rellena lo que falte con la otra
  const fromGoogle = fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`).then(r => r.json()).then(j => {
    const v = j.items && j.items[0] && j.items[0].volumeInfo;
    return v && { title: [v.title, v.subtitle].filter(Boolean).join(": "), author: (v.authors || []).join(", "), publisher: v.publisher || "", cover: ((v.imageLinks && v.imageLinks.thumbnail) || "").replace("http:", "https:") };
  }).catch(() => null);
  const fromOpenLibrary = fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`).then(r => r.json()).then(j => {
    const v = j["ISBN:" + isbn];
    return v && { title: [v.title, v.subtitle].filter(Boolean).join(": "), author: (v.authors || []).map(a => a.name).join(", "), publisher: (v.publishers || []).map(x => x.name).join(", "), cover: (v.cover && v.cover.medium) || "" };
  }).catch(() => null);
  const src = await Promise.all([fromGoogle, fromOpenLibrary]), m = {};
  for(const k of ["title", "author", "publisher", "cover"]) m[k] = (src.find(x => x && x[k]) || {})[k] || "";
  return m.title ? m : null;
}
async function onIsbn(code){
  if(scanDone) return;
  const isbn = toIsbn13(code);

    ${exists ? `<p class="empty">Este libro ya está en tu biblioteca (${total} ejemplar${total === 1 ? "" : "es"}). Si aceptas, se sumarán los ejemplares indicados.</p>` : ""}
    <form onsubmit="saveScanned(event)">${exists ? "" : `<label>Género<input name="genre" required></label><label>Edad recomendada<input name="age" required placeholder="Ej.: 6-8"></label>`}<label>Ejemplares a añadir<input name="copies" type="number" min="1" value="1" required></label>
    <div class="tools"><button>Sí, añadir</button><button type="button" class="ghost" onclick="renderScan()">No, escanear otro</button></div></form></div>`;
}

function drawCard(pdf, id, label, x, y){
  const W = 95, H = 55;
  pdf.setDrawColor(150); pdf.setLineDashPattern([1.5, 1.5], 0); pdf.rect(x, y, W, H); pdf.setLineDashPattern([], 0);
  pdf.setFontSize(7); pdf.setTextColor(100);
  pdf.text(pdf.splitTextToSize(cur.name, 45)[0], x + 5, y + 6);
  pdf.setFontSize(8); pdf.text(label, x + W - 5, y + 6, { align: "right" });
  const q = qrcode(0, "M"); q.addData(id); q.make();
  const n = q.getModuleCount(), cs = 30 / n; pdf.setFillColor(0);
  for(let r = 0; r < n; r++) for(let c = 0; c < n; c++) if(q.isDark(r, c)) pdf.rect(x + 5 + c * cs, y + 13 + r * cs, cs + .03, cs + .03, "F");
  pdf.setFontSize(10); pdf.setTextColor(0); pdf.text(id, x + 20, y + 49, { align: "center" });
  ["Izena", "Abizena", "Gela"].forEach((t, j) => {
    const ly = y + 22 + j * 11; pdf.setFontSize(9); pdf.text(t + ":", x + 42, ly);
    pdf.setDrawColor(0); pdf.line(x + 60, ly + .5, x + W - 5, ly + .5);
  });
}
function printCards(){
  const list = activeStudents();
  if(!list.length) return toast("No hay alumnos para imprimir", true);
  const pdf = new window.jspdf.jsPDF({ unit: "mm", format: "a4" }), W = 95, X0 = 10, Y0 = 11, H = 55;
  list.forEach((s, i) => {   // 5 alumnos por hoja: cada uno en una fila con dos copias
    const k = i % 5; if(i && k === 0) pdf.addPage();
    drawCard(pdf, s.id, "Irakaslea / Profesorado", X0, Y0 + k * H);
    drawCard(pdf, s.id, "Ikaslea / Alumnado", X0 + W, Y0 + k * H);
  });
  pdf.save(`tarjetas-alumnado-${cur.name}.pdf`);
}

async function onLoanStudent(text){
  if(scanDone) return;
  const code = String(text).trim().toUpperCase();
  if(!code) return;
  scanDone = true;
  const lend = loanMode === "lend";
  try{
    if(lend){
      const st = await db.doc(`schools/${cur.sid}/students/${code}`).get();
      if(!st.exists || st.data().deleted){ toast(`El código «${code}» no corresponde a ningún alumno`, true); setTimeout(() => { scanDone = false; }, 1500); return; }
    }
    stopScanner();
    $app.innerHTML = loading("Registrando…");
    loanResult(true, lend ? await doLend(code) : await doReturn(code));
  }catch(e){ console.error(e); stopScanner(); loanResult(false, e.message || "No se pudo registrar"); }
}
function loanResult(ok, text){
  const lend = loanMode === "lend";
  $app.innerHTML = `<div class="bar"><h2>${loanHead()}</h2></div>${stepper(ok ? 5 : 3)}<div class="banner ${ok ? "" : "err"}"><span>${ok ? "✅ " : ""}${esc(text)}</span></div>
    <nav class="menu"><button onclick="${ok ? "loanIsbnScreen()" : "loanStudentScreen()"}">${ok ? (lend ? "Prestar otro libro" : "Devolver otro libro") : "Escanear otro alumno"}</button><button class="ghost" onclick="renderLoans()">Volver</button></nav>`;
}
async function doLend(code){
  const b = loanBook, bookRef = db.doc(`schools/${cur.sid}/books/${b.id}`), loanRef = db.collection(`schools/${cur.sid}/loans`).doc();
  const used = new Set((await db.collection(`schools/${cur.sid}/loans`).where("isbn", "==", b.id).get()).docs.map(d => d.data()).filter(l => l.status === "active").map(l => l.copyNumber));
  let copy = 1; while(used.has(copy)) copy++;   // primer número de ejemplar libre
  await db.runTransaction(async tx => {
    const bs = await tx.get(bookRef), bk = bs.data();
    if(!bs.exists || !(bk.availableCopies > 0)) throw new Error("No quedan ejemplares disponibles");
    const left = bk.availableCopies - 1;
    tx.update(bookRef, { availableCopies: left, activeLoans: (bk.activeLoans || 0) + 1, available: left > 0 });
    tx.set(loanRef, { isbn: b.id, title: b.title || "", copyNumber: copy, studentCode: code, status: "active", loanDate: FV.serverTimestamp(), createdBy: me.uid });
  });
  return `Se ha registrado el préstamo del libro «${b.title}» al alumno ${code}.`;
}
async function doReturn(code){
  const b = loanBook, bookRef = db.doc(`schools/${cur.sid}/books/${b.id}`);
  const open = (await db.collection(`schools/${cur.sid}/loans`).where("isbn", "==", b.id).where("studentCode", "==", code).get()).docs.filter(d => d.data().status === "active");
  if(!open.length) throw new Error(`El alumno ${code} no tiene prestado «${b.title}».`);
  const loanRef = open.sort((x, y) => ((x.data().loanDate || {}).seconds || 0) - ((y.data().loanDate || {}).seconds || 0))[0].ref;
  await db.runTransaction(async tx => {
    const ls = await tx.get(loanRef), bs = await tx.get(bookRef);
    if(!ls.exists || ls.data().status !== "active") throw new Error("Ese préstamo ya no está activo");
    tx.update(loanRef, { status: "returned", returnedAt: FV.serverTimestamp(), returnedBy: me.uid });
    if(bs.exists){ const bk = bs.data(); tx.update(bookRef, { availableCopies: Math.min(bk.totalCopies || 0, (bk.availableCopies || 0) + 1), activeLoans: Math.max(0, (bk.activeLoans || 1) - 1), available: true }); }
  });
  return `Se ha registrado la devolución del libro «${b.title}» del alumno ${code}.`;
}

const EU_RE = [
  [/^Hay (\d+) solicitud(?:es)? nuevas? para unirse a «(.*)»\.$/, (n, c) => n === "1" ? `«${c}» ikastetxean sartzeko eskaera berri bat dago.` : `«${c}» ikastetxean sartzeko ${n} eskaera berri daude.`],
  [/^Hay (\d+) nuevas? solicitud(?:es)? para unirse a tu centro\.$/, n => n === "1" ? "Zure ikastetxean sartzeko eskaera berri bat dago." : `Zure ikastetxean sartzeko ${n} eskaera berri daude.`],
  [/^Código: (.*) · (.*)$/, (c, e) => `Kodea: ${c} · ${e}`],
  [/^Página (\d+) de (\d+)$/, (a, b) => `${a}. orrialdea (${b} guztira)`],
  [/^Disponibles: (\d+) \/ (\d+)$/, (a, b) => `Eskuragarri: ${a} / ${b}`],
  [/^Eliminar «(.*)»$/, c => `«${c}» ezabatu`],
  [/^No he encontrado datos para el ISBN (\d+)\.$/, i => `Ez dut daturik aurkitu ${i} ISBNrako.`],
  [/^El libro con ISBN (\d+) no está en la biblioteca de este centro\.$/, i => `${i} ISBN duen liburua ez dago ikastetxe honen liburutegian.`],
  [/^Este libro ya está en tu biblioteca \((\d+) ejemplares?\)\. Si aceptas, se sumarán los ejemplares indicados\.$/, n => `Liburu hau dagoeneko zure liburutegian dago (${n} ale). Onartzen baduzu, adierazitako aleak gehituko dira.`],
  [/^No quedan ejemplares disponibles de «(.*)»\.$/, t => `Ez dago alerik eskuragarri «${t}» liburuarenak.`],
  [/^El código «(.*)» no corresponde a ningún alumno$/, c => `«${c}» kodea ez dator ikasle batekin bat`],
  [/^Se ha registrado el préstamo del libro «(.*)» al alumno (\S+)\.$/, (t, a) => `«${t}» liburuaren mailegua erregistratu da ${a} ikaslearentzat.`],
  [/^Se ha registrado la devolución del libro «(.*)» del alumno (\S+)\.$/, (t, a) => `«${t}» liburuaren itzulketa erregistratu da (${a} ikaslea).`],
  [/^El alumno (\S+) no tiene prestado «(.*)»\.$/, (a, t) => `${a} ikasleak ez du «${t}» maileguan.`],
  [/^(\d+) alumnos creados\.$/, n => `${n} ikasle sortu dira.`],
  [/^(\S+) recuperado$/, c => `${c} berreskuratu da`],
  [/^¿Eliminar «(.*)» de la biblioteca\?$/, t => `«${t}» liburutegitik ezabatu nahi duzu?`],
  [/^¿Quitar a (\S+) de la lista\? Podrás recuperarlo después con «Recuperar alumnos»\.$/, c => `${c} zerrendatik kendu nahi duzu? Gero «Berreskuratu ikasleak» aukerarekin berreskuratu ahal izango duzu.`],
  [/^¿Cerrar el préstamo de «(.*)» al alumno (\S+) sin que se haya devuelto\?\n\nSe dará el libro por perdido y se descontará un ejemplar de la biblioteca\.$/, (t, a) => `«${t}» liburuaren mailegua itxi nahi duzu ${a} ikaslearentzat itzuli gabe?\n\nLiburua galdutzat joko da eta liburutegitik ale bat kenduko da.`],
  [/^Te hemos enviado un correo a (.*)\. Abre el mensaje y pulsa el enlace para confirmar tu cuenta\. Después vuelve aquí\.$/, e => `${e} helbidera mezu bat bidali dizugu. Ireki mezua eta sakatu esteka zure kontua berresteko. Gero, itzuli hona.`]
];
const trs = s => {   // castellano → euskara (si no hay traducción, se deja igual)
  if(lang !== "eus" || !s) return s;
  const k = s.trim(); if(!k) return s;
  let pre = "", core = k;
  if(core.startsWith("✅ ")){ pre = "✅ "; core = core.slice(2); }
  let r = EU[core];
  if(r === undefined) for(const [re, f] of EU_RE){ const m = core.match(re); if(m){ r = f(...m.slice(1)); break; } }
  if(r === undefined){
    const m = core.match(/^(.*?) \((\d+|tú)\)$/);
    if(m && EU[m[1]] !== undefined) r = EU[m[1]] + " (" + (m[2] === "tú" ? "zu" : m[2]) + ")";
    else if(m && m[2] === "tú") r = m[1] + " (zu)";
  }
  return r === undefined ? s : s.replace(k, () => pre + r);
};
const trKeys = r => Object.fromEntries(Object.entries(r).map(([k, v]) => [trs(k), v]));
const _confirm = window.confirm.bind(window), _prompt = window.prompt.bind(window);
window.confirm = m => _confirm(trs(m)); window.prompt = (m, d) => _prompt(trs(m), d);

const txtMap = new WeakMap(), attrMap = new WeakMap(), TR_ATTRS = ["placeholder", "aria-label", "title", "alt"];
const walker = () => document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, { acceptNode: n => /^(SCRIPT|STYLE)$/.test(n.parentNode.nodeName) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
function trAll(){
  const w = walker();
  for(let n; (n = w.nextNode());){
    const e = txtMap.get(n), src = e && n.nodeValue === e.t ? e.o : n.nodeValue, out = trs(src);
    if(out !== n.nodeValue){ txtMap.set(n, { o: src, t: out }); n.nodeValue = out; }
  }
  document.querySelectorAll("[placeholder],[aria-label],[title],[alt]").forEach(el => TR_ATTRS.forEach(a => {
    const v = el.getAttribute(a); if(v === null) return;
    const m = attrMap.get(el) || {}, e = m[a], src = e && v === e.t ? e.o : v, out = trs(src);
    if(out !== v){ m[a] = { o: src, t: out }; attrMap.set(el, m); el.setAttribute(a, out); }
  }));
}
function trRestore(){
  const w = walker();
  for(let n; (n = w.nextNode());){ const e = txtMap.get(n); if(e && n.nodeValue === e.t) n.nodeValue = e.o; }
  document.querySelectorAll("[placeholder],[aria-label],[title],[alt]").forEach(el => TR_ATTRS.forEach(a => {
    const e = (attrMap.get(el) || {})[a]; if(e && el.getAttribute(a) === e.t) el.setAttribute(a, e.o);
  }));
}
let trPending = false;
const OBS_OPTS = { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: TR_ATTRS };
const trObs = new MutationObserver(() => {
  if(trPending) return; trPending = true;
  requestAnimationFrame(() => { trPending = false; if(lang !== "eus") return; trObs.disconnect(); trAll(); trObs.observe(document.body, OBS_OPTS); });
});
function setLang(l){
  lang = l; localStorage.setItem("lang", l);
  document.documentElement.lang = l === "eus" ? "eu" : "es";
  const b = document.getElementById("lang"); b.textContent = l === "eus" ? "ES" : "EUS";
  b.setAttribute("aria-label", l === "eus" ? "Cambiar a castellano" : "Cambiar a euskera");
  trObs.disconnect();
  if(l === "eus"){ trAll(); trObs.observe(document.body, OBS_OPTS); } else trRestore();
}
function toggleLang(){ setLang(lang === "eus" ? "es" : "eus"); }
setLang(lang);
